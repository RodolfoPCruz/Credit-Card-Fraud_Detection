[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =========================
# METADADOS DO PROJETO
# =========================
[project]
name = "datapipeline"
version = "0.1.0"
description = "Data pipeline and model training with MLflow"
readme = "README.md"
requires-python = ">=3.10"

# Dependências de RUNTIME
dependencies = [
  "mlflow>=2.8,<3.0",
  "pandas>=2.0,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "PyYAML>=6.0",
  "jupyterlab>=4.0,<5.0",
  "ydata-profiling>=4.0,<5.0",
  "catboost>=1.0,<2.0",
  "lightgbm>=4.0,<5.0",
  "xgboost>=3.0,<4.0",
  "ipywidgets>=8.0,<9.0"
]

# =========================
# DEPENDÊNCIAS OPCIONAIS
# =========================
[project.optional-dependencies]
dev = [
  "pytest",
  "pipreqs",
  "black",
  "ruff",
  "jupyterlab",
  "ipykernel"
]

# =========================
# CONFIGURAÇÃO DO SETUPTOOLS
# =========================
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# =========================
# FERRAMENTAS
# =========================
[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

